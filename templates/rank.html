<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rankings</title>
    </head>
    <body>
        <h1>RankJams</h1>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('results') }}">Results</a>
        <hr>
        <p>Pick your favorite between these two recently played songs:</p>
        <form method="post" action={{ url_for('rank') }}>
            <input type="hidden" name="winner" value="{{ song1.id }}">
            <input type="hidden" name="loser" value="{{ song2.id }}">
            <button type="submit">
                <img src="{{ song1.image }}" alt="{{ song1.name }}" width="300" height="300">
                <p>{{ song1.name }}</p>
            </button>
        </form>
        <br>
        <h4>VERSUS</h4>
        <p>Pick your favorite between these two recently played songs:</p>
        <br>
        <form method="post" action={{ url_for('rank') }}>
            <input type="hidden" name="winner" value="{{ song2.id }}">
            <input type="hidden" name="loser" value="{{ song1.id }}">
            <button type="submit">
                <img src="{{ song2.image }}" alt="{{ song2.name }}" width="300" height="300">
                <p>{{ song2.name }}</p>
            </button>
        </form>
        <br>
    </body>
</html>
