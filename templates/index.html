{% extends "base.html" %}

{% block content %} 
    <h1>RankJams</h1>
    <hr>
    <p>Here are six songs I like:</p>
    <ol>
        {% for song in songs %}
            <li>
                {{ song.name }}
                <br>
                <img src="{{ song.image }}" alt="{{ song.name }}" width="300" height="300">
            </li>
            
        {% endfor %}
    </ol>
{% endblock %}
